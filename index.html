<!doctype html>
<html class="dark" lang="ru">

<head>

    <link href="https://fonts.googleapis.com" rel="preconnect" />

                padding: 0;
                font-family: 'Delight', 'Plus Jakarta Sans', 'Outfit', sans-serif;

                color: #fafafa;
