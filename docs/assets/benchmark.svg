<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 290" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090d" />
      <stop offset="100%" stop-color="#040406" />
    </linearGradient>

    <!-- freakcloud Gold Gradient -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f7e479" />
      <stop offset="100%" stop-color="#ffd700" />
    </linearGradient>

    <!-- Muted Red Bar Gradient -->
    <linearGradient id="red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.85" />
    </linearGradient>

    <!-- Muted Orange/Gray Bar Gradient -->
    <linearGradient id="amber-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.85" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f7e479" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 14px; font-weight: 700; fill: #ffffff; letter-spacing: -0.02em; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #71717a; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 500; fill: #a1a1aa; }
    .label-hero { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #f7e479; }
    .val-mono { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 12px; font-weight: 600; fill: #d4d4d8; }
    .val-hero { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 12px; font-weight: 800; fill: #f7e479; }
    .badge-text { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 10px; font-weight: 600; fill: #000000; }
    .stat-label { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; fill: #71717a; }
    .stat-val { font-family: 'JetBrains Mono', Consolas, Monaco, monospace; font-size: 11px; font-weight: 600; fill: #f4f4f5; }
  </style>

  <!-- Frame Background -->
  <rect x="1" y="1" width="838" height="288" fill="url(#bg-grad)" stroke="#27272a" stroke-width="1" />

  <!-- Header Section -->
  <text x="32" y="38" class="title">RAM Usage during Playback</text>
  <text x="32" y="55" class="subtitle">Measured during active stream · Lower is better</text>

  <!-- Benchmark Row 1: Chrome Tab -->
  <text x="32" y="98" class="label">Chrome Tab (SoundCloud)</text>
  <rect x="230" y="85" width="480" height="18" fill="url(#red-grad)" />
  <text x="722" y="99" class="val-mono">850 MB</text>

  <!-- Benchmark Row 2: Electron Players -->
  <text x="32" y="146" class="label">Electron Players (Dotify / Mimose)</text>
  <rect x="230" y="133" width="294" height="18" fill="url(#amber-grad)" />
  <text x="536" y="147" class="val-mono">520 MB</text>

  <!-- Benchmark Row 3: freakcloud (HERO) -->
  <text x="32" y="196" class="label-hero">freakcloud (Rust + Tauri v2)</text>
  <rect x="230" y="181" width="36" height="22" fill="url(#gold-grad)" filter="url(#glow)" />
  <text x="278" y="197" class="val-hero">50 MB</text>

  <!-- Savings Badge -->
  <rect x="332" y="182" width="136" height="20" fill="#f7e479" />
  <text x="340" y="196" class="badge-text">⚡ 17x LESS MEMORY</text>

  <!-- Divider Line -->
  <line x1="32" y1="230" x2="808" y2="230" stroke="#27272a" stroke-width="1" />

  <!-- Footer Quick Stats -->
  <g transform="translate(32, 258)">
    <text x="0" y="0" class="stat-label">Idle CPU:</text>
    <text x="60" y="0" class="stat-val" fill="#f7e479">0.0% (Kinetic Sleep)</text>

    <text x="260" y="0" class="stat-label">Installer Size:</text>
    <text x="352" y="0" class="stat-val">3.3 MB (vs 120 MB)</text>

    <text x="560" y="0" class="stat-label">Private Memory:</text>
    <text x="668" y="0" class="stat-val">11.2 MB</text>
  </g>
</svg>
